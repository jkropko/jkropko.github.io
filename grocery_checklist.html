<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wegmans Shopping Checklist</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      padding: 1.5rem;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    h2 {
      margin-top: 1.5rem;
      margin-bottom: 0.25rem;
    }
    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 0.25rem;
    }
    li {
      margin: 0.15rem 0;
    }
    label {
      cursor: pointer;
    }
    input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .section {
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.75rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <h1>Wegmans Shopping Checklist</h1>

  <div class="section">
    <h2>🥦 Produce Department</h2>
    <ul>
      <li><label><input type="checkbox">Apples</label></li>
      <li><label><input type="checkbox">Spring onions (scallions)</label></li>
      <li><label><input type="checkbox">Garlic — 1 bulb</label></li>
      <li><label><input type="checkbox">Red chili — 1</label></li>
      <li><label><input type="checkbox">Carrots — 2</label></li>
      <li><label><input type="checkbox">Green beans — 1 small bag</label></li>
      <li><label><input type="checkbox">Broccoli — ½ head</label></li>
      <li><label><input type="checkbox">Red bell pepper — 1</label></li>
      <li><label><input type="checkbox">Mung bean sprouts — small container</label></li>
      <li><label><input type="checkbox">Cilantro — 1 bunch</label></li>
      <li><label><input type="checkbox">Limes — 2–3</label></li>
      <li><label><input type="checkbox">Tomatoes — several</label></li>
      <li><label><input type="checkbox">Red onion — 1 small</label></li>
      <li><label><input type="checkbox">Onions — 2–3</label></li>
      <li><label><input type="checkbox">Avocados — 1–2</label></li>
      <li><label><input type="checkbox">Salad kits — 3</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>🥬 Organic / Plant-Based Refrigerated</h2>
    <ul>
      <li><label><input type="checkbox">Extra-firm tofu — 3 blocks</label></li>
      <li><label><input type="checkbox">Beyond Burgers (if refrigerated)</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>🥛 Dairy Alternatives</h2>
    <ul>
      <li><label><input type="checkbox">Unsweetened almond milk — 2 cartons</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>🥫 Center Store Aisles</h2>

    <h3>Asian / International</h3>
    <ul>
      <li><label><input type="checkbox">Tamarind paste or sauce</label></li>
      <li><label><input type="checkbox">Tamari or soy sauce</label></li>
      <li><label><input type="checkbox">Vegan fish sauce (optional)</label></li>
      <li><label><input type="checkbox">Rice noodles — 1 package</label></li>
    </ul>

    <h3>Spices</h3>
    <ul>
      <li><label><input type="checkbox">Black pepper</label></li>
      <li><label><input type="checkbox">Chili powder</label></li>
      <li><label><input type="checkbox">Ground cumin</label></li>
    </ul>

    <h3>Baking / Health</h3>
    <ul>
      <li><label><input type="checkbox">Maple syrup</label></li>
      <li><label><input type="checkbox">Nutritional yeast</label></li>
      <li><label><input type="checkbox">Hemp hearts</label></li>
      <li><label><input type="checkbox">Apples &amp; cinnamon instant oatmeal</label></li>
    </ul>

    <h3>Condiments</h3>
    <ul>
      <li><label><input type="checkbox">Barbecue sauce</label></li>
      <li><label><input type="checkbox">Sriracha sauce</label></li>
      <li><label><input type="checkbox">Dill sandwich pickles</label></li>
      <li><label><input type="checkbox">Salsa or pico de gallo (jarred, if using)</label></li>
    </ul>

    <h3>Canned Goods</h3>
    <ul>
      <li><label><input type="checkbox">Black beans — 1 can</label></li>
    </ul>

    <h3>Hot Beverages</h3>
    <ul>
      <li><label><input type="checkbox">Hot cocoa</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>🍞 Bread / Bakery</h2>
    <ul>
      <li><label><input type="checkbox">Hamburger buns</label></li>
      <li><label><input type="checkbox">Tortillas (corn or flour)</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>🥶 Frozen Foods</h2>
    <ul>
      <li><label><input type="checkbox">Frozen riced cauliflower — 3 bags</label></li>
      <li><label><input type="checkbox">Frozen cauliflower</label></li>
      <li><label><input type="checkbox">Frozen waffles</label></li>
      <li><label><input type="checkbox">Curly fries</label></li>
      <li><label><input type="checkbox">Beyond Burgers (if in frozen section)</label></li>
    </ul>
  </div>

  <div class="section">
    <h2>🥜 Snacks / Nuts</h2>
    <ul>
      <li><label><input type="checkbox">Roasted unsalted peanuts — 1 small bag</label></li>
    </ul>
  </div>
</body>
</html>
